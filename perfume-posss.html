<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novara Luxe — سیستەمی فرۆشتن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241220;
    --ink-soft:#3a2e35;
    --gold:#c9a227;
    --gold-light:#e4c874;
    --cream:#f6efe4;
    --cream-dark:#ede2d0;
    --rose:#b98285;
    --success:#6b8f71;
    --danger:#b4534a;
    --shadow: 0 8px 24px rgba(36,18,32,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Vazirmatn',sans-serif;
    background:linear-gradient(180deg,var(--ink) 0%, #2f1c2b 340px, var(--cream) 340px);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Amiri',serif;}

  /* ---------- header ---------- */
  header{
    padding:28px 24px 18px;
    color:var(--cream);
    text-align:center;
  }
  header .brand{
    display:flex; align-items:center; justify-content:center; gap:12px;
  }
  header .brand-icon{
    width:44px;height:44px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 60%, #8a6c1a 100%);
    box-shadow:0 0 0 3px rgba(201,162,39,0.25);
    flex-shrink:0;
  }
  header h1{font-size:28px;margin:0;letter-spacing:.5px;}
  header p{margin:6px 0 0;font-size:13px;color:var(--gold-light);opacity:.9;}

  nav.tabs{
    display:flex; justify-content:center; gap:6px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  nav.tabs button{
    background:transparent;
    border:1px solid rgba(228,200,116,0.35);
    color:var(--cream);
    padding:9px 18px;
    border-radius:999px;
    font-family:'Vazirmatn',sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
  }
  nav.tabs button.active{
    background:var(--gold);
    color:var(--ink);
    border-color:var(--gold);
  }
  nav.tabs button:hover:not(.active){border-color:var(--gold-light);}

  main{max-width:1180px;margin:0 auto;padding:24px 20px 80px;}
  .view{display:none;animation:fade .25s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ---------- sell view layout ---------- */
  .sell-layout{
    display:flex;
    gap:22px;
    align-items:flex-start;
  }
  .sell-main{flex:1 1 auto;min-width:0;}
  .cart-panel{
    width:320px;
    flex-shrink:0;
    background:var(--cream);
    border-radius:14px;
    box-shadow:var(--shadow);
    position:relative;
    padding:18px 16px 16px;
  }
  .cart-panel::before{
    content:"";
    position:absolute; top:-1px; right:14px; left:14px; height:10px;
    background-image:radial-gradient(circle 6px at 10px 0, var(--ink) 5px, transparent 5.5px);
    background-size:20px 10px;
    background-repeat:repeat-x;
    opacity:.08;
  }
  .cart-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cart-title h3{margin:0;font-size:19px;}
  .cart-count{
    background:var(--ink);color:var(--gold-light);font-size:12px;
    padding:2px 9px;border-radius:999px;font-family:'Vazirmatn';
  }
  .cart-items{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .cart-empty{text-align:center;color:#9a8f8f;font-size:13px;padding:26px 8px;}
  .cart-item{
    display:flex;align-items:center;gap:10px;
    background:#fff;border-radius:10px;padding:8px;
    border:1px solid var(--cream-dark);
  }
  .cart-item img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--cream-dark);flex-shrink:0;}
  .cart-item .ci-name{font-size:13px;font-weight:600;flex:1;min-width:0;}
  .cart-item .ci-price{font-size:12px;color:var(--ink-soft);}
  .qty-ctrl{display:flex;align-items:center;gap:6px;}
  .qty-ctrl button{
    width:22px;height:22px;border-radius:6px;border:1px solid var(--cream-dark);
    background:var(--cream);cursor:pointer;font-size:14px;line-height:1;color:var(--ink);
  }
  .qty-ctrl button:hover{background:var(--gold-light);}
  .cart-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:2px;}
  .cart-summary{border-top:1.5px dashed var(--cream-dark);padding-top:12px;margin-top:4px;}
  .cart-summary-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;color:var(--ink-soft);}
  .cart-summary-row.total{font-size:19px;font-weight:800;color:var(--ink);}
  .cart-summary-row.total span:last-child{color:var(--gold);font-family:'Amiri',serif;}
  .btn-gold{
    width:100%;padding:13px;margin-top:10px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
    border:none;border-radius:10px;font-weight:800;font-size:15px;
    color:var(--ink);cursor:pointer;letter-spacing:.3px;
    box-shadow:0 4px 10px rgba(201,162,39,0.35);
  }
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-gold:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{
    width:100%;padding:9px;margin-top:8px;background:none;border:1px solid var(--cream-dark);
    border-radius:10px;color:var(--ink-soft);font-size:13px;cursor:pointer;font-family:'Vazirmatn';
  }

  /* ---------- search + categories ---------- */
  .search-row{display:flex;gap:10px;margin-bottom:14px;}
  .search-row input{
    flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--cream-dark);
    font-family:'Vazirmatn';font-size:14px;background:#fff;
  }
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .chip{
    padding:7px 16px;border-radius:999px;border:1px solid var(--cream-dark);
    background:#fff;font-size:13px;cursor:pointer;font-weight:600;color:var(--ink-soft);
  }
  .chip.active{background:var(--ink);color:var(--gold-light);border-color:var(--ink);}

  /* ---------- product grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
  .card{
    background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
    display:flex;flex-direction:column;cursor:pointer;transition:transform .15s;
    border:1px solid var(--cream-dark);
  }
  .card:hover{transform:translateY(-3px);}
  .card-img{
    height:120px;background:var(--cream-dark);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .card-img img{width:100%;height:100%;object-fit:cover;}
  .card-img .placeholder{font-size:30px;opacity:.35;}
  .card-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:4px;}
  .card-cat{font-size:11px;color:var(--rose);font-weight:700;}
  .card-name{font-size:15px;font-weight:700;font-family:'Amiri',serif;line-height:1.3;}
  .card-price{margin-top:auto;font-size:15px;font-weight:800;color:var(--gold);}
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }
  .empty-state .big{font-size:40px;margin-bottom:10px;}

  /* ---------- manage view ---------- */
  .manage-layout{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
  .panel{
    background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:20px;
    border:1px solid var(--cream-dark);
  }
  .panel h3{margin-top:0;font-size:19px;}
  .form-panel{flex:1 1 340px;}
  .list-panel{flex:1 1 420px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],select{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--cream-dark);
    font-family:'Vazirmatn';font-size:14px;background:var(--cream);
  }
  .cat-add-row{display:flex;gap:8px;}
  .cat-add-row select{flex:1;}
  .cat-add-row button{
    background:var(--ink);color:var(--gold-light);border:none;border-radius:9px;padding:0 14px;
    font-size:18px;cursor:pointer;
  }
  .barcode-row{display:flex;gap:8px;}
  .barcode-row input{flex:1;font-family:'Courier New',monospace;letter-spacing:1px;}
  .barcode-row button{
    background:var(--ink);color:var(--gold-light);border:none;border-radius:9px;padding:0 14px;
    font-size:16px;cursor:pointer;flex-shrink:0;
  }
  .barcode-row button:hover{background:var(--ink-soft);}
  .profit-hint{font-size:12.5px;margin-top:6px;font-weight:600;color:var(--ink-soft);min-height:16px;}
  .profit-hint.positive{color:var(--success);}
  .profit-hint.negative{color:var(--danger);}
  .pr-barcode{
    font-family:'Courier New',monospace;font-size:11px;color:#9a8f8f;letter-spacing:.5px;
  }
  .card-barcode{
    font-family:'Courier New',monospace;font-size:10px;color:#9a8f8f;letter-spacing:.5px;
  }
  .img-drop{
    margin-top:6px;border:2px dashed var(--cream-dark);border-radius:12px;
    padding:14px;text-align:center;cursor:pointer;background:var(--cream);
    position:relative;overflow:hidden;
  }
  .img-drop img{max-width:100%;max-height:120px;border-radius:8px;}
  .img-drop .hint{font-size:12px;color:#9a8f8f;}
  .form-actions{display:flex;gap:10px;margin-top:16px;}
  .btn-primary{
    flex:1;padding:11px;background:var(--ink);color:var(--gold-light);border:none;border-radius:10px;
    font-weight:700;cursor:pointer;font-size:14px;
  }
  .btn-cancel{
    padding:11px 16px;background:none;border:1px solid var(--cream-dark);border-radius:10px;cursor:pointer;
    color:var(--ink-soft);font-size:14px;
  }
  .prod-row{
    display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--cream);
  }
  .prod-row img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--cream-dark);}
  .prod-row .pr-info{flex:1;min-width:0;}
  .prod-row .pr-name{font-size:14px;font-weight:700;}
  .prod-row .pr-meta{font-size:12px;color:var(--ink-soft);}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:4px 6px;color:var(--ink-soft);}
  .icon-btn:hover{color:var(--gold);}
  .icon-btn.danger:hover{color:var(--danger);}
  .cat-tag{
    display:inline-flex;align-items:center;gap:6px;background:var(--cream);border-radius:999px;
    padding:5px 12px;font-size:12.5px;margin:4px 5px 4px 0;font-weight:600;
  }
  .cat-tag button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;}

  /* ---------- history ---------- */
  .stat-row{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-card{
    flex:1 1 160px;background:#fff;border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);
    border:1px solid var(--cream-dark);
  }
  .stat-card .label{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .stat-card .val{font-size:24px;font-weight:800;color:var(--ink);font-family:'Amiri',serif;margin-top:2px;}
  .sale-card{
    background:#fff;border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;
    border:1px solid var(--cream-dark);overflow:hidden;
  }
  .sale-head{
    display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;
  }
  .sale-head .sh-date{font-size:13px;color:var(--ink-soft);}
  .sale-head .sh-total{font-weight:800;color:var(--gold);font-family:'Amiri',serif;font-size:16px;}
  .sale-body{display:none;padding:0 16px 12px;border-top:1px dashed var(--cream-dark);}
  .sale-body.open{display:block;}
  .sale-line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--ink-soft);}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--cream);padding:11px 22px;border-radius:999px;
    font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:.25s;z-index:999;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:820px){
    .sell-layout{flex-direction:column;}
    .cart-panel{width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon"></div>
    <h1>Novara Luxe</h1>
  </div>
  <p>سیستەمی فرۆشتن — بەرهەم، نرخ و کاتاگۆری بە دڵخوازی خۆت بەڕێوە ببە</p>
  <nav class="tabs">
    <button data-tab="sell" class="active">فرۆشتن</button>
    <button data-tab="manage">بەرهەمەکان</button>
    <button data-tab="history">مێژووی فرۆشتن</button>
  </nav>
</header>

<main>

  <!-- ===== SELL VIEW ===== -->
  <section id="view-sell" class="view active">
    <div class="sell-layout">
      <div class="sell-main">
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="گەڕان بۆ بەرهەم...">
        </div>
        <div class="chips" id="catChips"></div>
        <div class="grid" id="productGrid"></div>
      </div>

      <aside class="cart-panel">
        <div class="cart-title">
          <h3>سەبەتە</h3>
          <span class="cart-count" id="cartCount">0</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-summary">
          <div class="cart-summary-row total"><span>کۆی گشتی</span><span id="cartTotal">0 د.ع</span></div>
        </div>
        <button class="btn-gold" id="checkoutBtn" disabled>تەواوکردنی فرۆشتن</button>
        <button class="btn-ghost" id="clearCartBtn">پاککردنەوەی سەبەتە</button>
      </aside>
    </div>
  </section>

  <!-- ===== MANAGE VIEW ===== -->
  <section id="view-manage" class="view">
    <div class="manage-layout">
      <div class="panel form-panel">
        <h3 id="formTitle">زیادکردنی بەرهەمی نوێ</h3>
        <label>وێنەی بەرهەم</label>
        <div class="img-drop" id="imgDrop">
          <div id="imgPreviewWrap"><span class="hint">کرتە بکە بۆ هەڵبژاردنی وێنە یان کێشانی وێنە بۆ ئێرە</span></div>
          <input type="file" id="imgInput" accept="image/*" style="display:none;">
        </div>

        <label>ناوی بۆن</label>
        <input type="text" id="prodName" placeholder="بۆ نموونە: عود ڕۆیاڵ">

        <label>نرخی کڕین (تێچوون) — د.ع <span style="font-weight:400;color:#9a8f8f;">(ئارەزوومەندانە)</span></label>
        <input type="number" id="prodCost" placeholder="0" min="0">

        <label>نرخی فرۆشتن (د.ع)</label>
        <input type="number" id="prodPrice" placeholder="0" min="0">
        <div id="profitHint" class="profit-hint"></div>

        <label>کۆد / بارکۆد <span style="font-weight:400;color:#9a8f8f;">(ئارەزوومەندانە)</span></label>
        <div class="barcode-row">
          <input type="text" id="prodBarcode" placeholder="بۆ نموونە: 6291041500213" inputmode="numeric">
          <button type="button" id="genBarcodeBtn" title="دروستکردنی کۆدی خۆکار">↻</button>
        </div>

        <label>کاتاگۆری</label>
        <div class="cat-add-row">
          <select id="prodCat"></select>
          <button id="quickAddCatBtn" title="زیادکردنی کاتاگۆری نوێ">+</button>
        </div>

        <div class="form-actions">
          <button class="btn-primary" id="saveProdBtn">پاشەکەوتکردن</button>
          <button class="btn-cancel" id="cancelProdBtn" style="display:none;">هەڵوەشاندنەوە</button>
        </div>

        <div style="margin-top:26px;">
          <h3 style="font-size:16px;">کاتاگۆرییەکان</h3>
          <div id="catList"></div>
        </div>
      </div>

      <div class="panel list-panel">
        <h3>هەموو بەرهەمەکان (<span id="prodTotalCount">0</span>)</h3>
        <div id="prodList"></div>
      </div>
    </div>
  </section>

  <!-- ===== HISTORY VIEW ===== -->
  <section id="view-history" class="view">
    <div class="stat-row">
      <div class="stat-card"><div class="label">کۆی داهات</div><div class="val" id="statRevenue">0 د.ع</div></div>
      <div class="stat-card"><div class="label">کۆی قازانج</div><div class="val" id="statProfit" style="color:var(--success);">0 د.ع</div></div>
      <div class="stat-card"><div class="label">ژمارەی فرۆشتن</div><div class="val" id="statCount">0</div></div>
      <div class="stat-card"><div class="label">فرۆشراوترین بۆن</div><div class="val" id="statTop" style="font-size:16px;">—</div></div>
    </div>
    <div id="historyList"></div>
  </section>

</main>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'pos-data';
let data = { categories: [], products: [], sales: [] };
let cart = [];
let editingProductId = null;
let activeCat = 'هەموو';
let pendingImage = null;

const DEFAULT_CATEGORIES = ['بۆنی پیاوان','بۆنی ژنان','یونیسێکس','تری'];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function fmt(n){
  return Number(n||0).toLocaleString('en-US') + ' د.ع';
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      data = JSON.parse(raw);
    }else{
      data = { categories: [...DEFAULT_CATEGORIES], products: [], sales: [] };
      await saveData();
    }
  }catch(e){
    data = { categories: [...DEFAULT_CATEGORIES], products: [], sales: [] };
  }
  renderAll();
}

async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    toast('کێشەیەک ڕوویدا لە پاشەکەوتکردن');
  }
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

/* ---------------- TABS ---------------- */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='manage') renderManage();
    if(btn.dataset.tab==='history') renderHistory();
  });
});

/* ---------------- RENDER: SELL ---------------- */
function renderAll(){
  renderCatChips();
  renderProductGrid();
  renderCatSelect();
  renderCart();
}

function renderCatChips(){
  const wrap = document.getElementById('catChips');
  const cats = ['هەموو', ...data.categories];
  wrap.innerHTML = cats.map(c=>
    `<button class="chip ${c===activeCat?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{
      activeCat = ch.dataset.cat;
      renderCatChips();
      renderProductGrid();
    });
  });
}

function renderProductGrid(){
  const grid = document.getElementById('productGrid');
  const q = (document.getElementById('searchInput').value||'').trim().toLowerCase();
  let list = data.products.filter(p=>{
    const catOk = activeCat==='هەموو' || p.category===activeCat;
    const qOk = !q || p.name.toLowerCase().includes(q) || (p.barcode && p.barcode.toLowerCase().includes(q));
    return catOk && qOk;
  });
  if(list.length===0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="big">🌸</div>
      <div>هیچ بەرهەمێک نییە. لە بەشی «بەرهەمەکان» بۆنی نوێ زیاد بکە.</div>
    </div>`;
    return;
  }
  grid.innerHTML = list.map(p=>`
    <div class="card" data-id="${p.id}">
      <div class="card-img">${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : `<span class="placeholder">🌸</span>`}</div>
      <div class="card-body">
        <span class="card-cat">${escapeHtml(p.category)}</span>
        <span class="card-name">${escapeHtml(p.name)}</span>
        <span class="card-price">${fmt(p.price)}</span>
        ${p.barcode ? `<span class="card-barcode">#${escapeHtml(p.barcode)}</span>` : ''}
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> addToCart(c.dataset.id));
  });
}

document.getElementById('searchInput').addEventListener('input', renderProductGrid);
document.getElementById('searchInput').addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  const q = e.target.value.trim();
  if(!q) return;
  const match = data.products.find(p=>p.barcode && p.barcode === q);
  if(match){
    addToCart(match.id);
    e.target.value = '';
    renderProductGrid();
  }
});

/* ---------------- CART ---------------- */
function addToCart(id){
  const prod = data.products.find(p=>p.id===id);
  if(!prod) return;
  const line = cart.find(c=>c.id===id);
  if(line) line.qty++;
  else cart.push({id:prod.id, name:prod.name, price:prod.price, cost:prod.cost||0, image:prod.image, qty:1});
  renderCart();
  toast(prod.name + ' زیادکرا بۆ سەبەتە');
}

function renderCart(){
  const wrap = document.getElementById('cartItems');
  document.getElementById('cartCount').textContent = cart.reduce((s,c)=>s+c.qty,0);
  if(cart.length===0){
    wrap.innerHTML = `<div class="cart-empty">سەبەتەکەت بەتاڵە</div>`;
  }else{
    wrap.innerHTML = cart.map(c=>`
      <div class="cart-item" data-id="${c.id}">
        ${c.image?`<img src="${c.image}">`:`<img style="display:flex;align-items:center;justify-content:center;">`}
        <div style="flex:1;min-width:0;">
          <div class="ci-name">${escapeHtml(c.name)}</div>
          <div class="ci-price">${fmt(c.price)}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qminus">−</button>
          <span>${c.qty}</span>
          <button class="qplus">+</button>
        </div>
        <button class="cart-remove" title="سڕینەوە">✕</button>
      </div>
    `).join('');
    wrap.querySelectorAll('.cart-item').forEach(row=>{
      const id = row.dataset.id;
      row.querySelector('.qplus').addEventListener('click', ()=>{
        cart.find(c=>c.id===id).qty++; renderCart();
      });
      row.querySelector('.qminus').addEventListener('click', ()=>{
        const line = cart.find(c=>c.id===id);
        line.qty--;
        if(line.qty<=0) cart = cart.filter(c=>c.id!==id);
        renderCart();
      });
      row.querySelector('.cart-remove').addEventListener('click', ()=>{
        cart = cart.filter(c=>c.id!==id); renderCart();
      });
    });
  }
  const total = cart.reduce((s,c)=>s+c.price*c.qty,0);
  document.getElementById('cartTotal').textContent = fmt(total);
  document.getElementById('checkoutBtn').disabled = cart.length===0;
}

document.getElementById('clearCartBtn').addEventListener('click', ()=>{
  cart = []; renderCart();
});

document.getElementById('checkoutBtn').addEventListener('click', async ()=>{
  if(cart.length===0) return;
  const total = cart.reduce((s,c)=>s+c.price*c.qty,0);
  const profit = cart.reduce((s,c)=>s+(c.price-(c.cost||0))*c.qty,0);
  const sale = {
    id: uid(),
    date: new Date().toISOString(),
    items: cart.map(c=>({name:c.name, price:c.price, cost:c.cost||0, qty:c.qty})),
    total,
    profit
  };
  data.sales.unshift(sale);
  await saveData();
  cart = [];
  renderCart();
  toast('فرۆشتن سەرکەوتوو بوو ✓ — ' + fmt(total));
});

/* ---------------- MANAGE: CATEGORIES ---------------- */
function renderCatSelect(){
  const sel = document.getElementById('prodCat');
  sel.innerHTML = data.categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
}

function renderCatList(){
  const wrap = document.getElementById('catList');
  wrap.innerHTML = data.categories.map(c=>{
    const inUse = data.products.some(p=>p.category===c);
    return `<span class="cat-tag">${escapeHtml(c)}${inUse?'':` <button data-cat="${escapeHtml(c)}">✕</button>`}</span>`;
  }).join('') || '<span style="font-size:13px;color:#9a8f8f;">هیچ کاتاگۆرییەک نییە</span>';
  wrap.querySelectorAll('button[data-cat]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      data.categories = data.categories.filter(c=>c!==b.dataset.cat);
      await saveData();
      renderCatList(); renderCatSelect(); renderCatChips();
      toast('کاتاگۆری سڕایەوە');
    });
  });
}

document.getElementById('quickAddCatBtn').addEventListener('click', async ()=>{
  const name = prompt('ناوی کاتاگۆریی نوێ بنووسە:');
  if(!name || !name.trim()) return;
  if(data.categories.includes(name.trim())){ toast('ئەم کاتاگۆریە هەیە پێشتر'); return; }
  data.categories.push(name.trim());
  await saveData();
  renderCatSelect(); renderCatList(); renderCatChips();
  document.getElementById('prodCat').value = name.trim();
  toast('کاتاگۆری زیادکرا');
});

/* ---------------- MANAGE: IMAGE UPLOAD ---------------- */
const imgDrop = document.getElementById('imgDrop');
const imgInput = document.getElementById('imgInput');
imgDrop.addEventListener('click', ()=>imgInput.click());
imgDrop.addEventListener('dragover', e=>{e.preventDefault(); imgDrop.style.background='var(--cream-dark)';});
imgDrop.addEventListener('dragleave', ()=>{imgDrop.style.background='var(--cream)';});
imgDrop.addEventListener('drop', e=>{
  e.preventDefault();
  imgDrop.style.background='var(--cream)';
  if(e.dataTransfer.files[0]) handleImageFile(e.dataTransfer.files[0]);
});
imgInput.addEventListener('change', ()=>{
  if(imgInput.files[0]) handleImageFile(imgInput.files[0]);
});

function handleImageFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 400;
      let w = img.width, h = img.height;
      if(w>h && w>maxDim){ h = h*(maxDim/w); w = maxDim; }
      else if(h>=w && h>maxDim){ w = w*(maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      pendingImage = canvas.toDataURL('image/jpeg', 0.78);
      document.getElementById('imgPreviewWrap').innerHTML = `<img src="${pendingImage}">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- MANAGE: PRODUCT FORM ---------------- */
function resetForm(){
  editingProductId = null;
  pendingImage = null;
  document.getElementById('formTitle').textContent = 'زیادکردنی بەرهەمی نوێ';
  document.getElementById('prodName').value = '';
  document.getElementById('prodCost').value = '';
  document.getElementById('prodPrice').value = '';
  document.getElementById('prodBarcode').value = '';
  document.getElementById('imgPreviewWrap').innerHTML = '<span class="hint">کرتە بکە بۆ هەڵبژاردنی وێنە یان کێشانی وێنە بۆ ئێرە</span>';
  document.getElementById('cancelProdBtn').style.display = 'none';
  updateProfitHint();
  renderCatSelect();
}

document.getElementById('cancelProdBtn').addEventListener('click', resetForm);

function updateProfitHint(){
  const el = document.getElementById('profitHint');
  const cost = parseFloat(document.getElementById('prodCost').value);
  const price = parseFloat(document.getElementById('prodPrice').value);
  if(isNaN(cost) || isNaN(price)){ el.textContent=''; el.className='profit-hint'; return; }
  const profit = price - cost;
  const margin = price>0 ? (profit/price*100) : 0;
  el.className = 'profit-hint ' + (profit>0?'positive':profit<0?'negative':'');
  el.textContent = (profit>=0?'قازانج: ':'زەرەر: ') + fmt(Math.abs(profit)) + ' (%' + margin.toFixed(0) + ')';
}
document.getElementById('prodCost').addEventListener('input', updateProfitHint);
document.getElementById('prodPrice').addEventListener('input', updateProfitHint);

function generateBarcode(){
  let digits = '2';
  for(let i=0;i<11;i++) digits += Math.floor(Math.random()*10);
  let sum = 0;
  for(let i=0;i<12;i++) sum += Number(digits[i]) * (i%2===0?1:3);
  const check = (10 - (sum%10)) % 10;
  return digits + check;
}
document.getElementById('genBarcodeBtn').addEventListener('click', ()=>{
  let code;
  do{ code = generateBarcode(); }while(data.products.some(p=>p.barcode===code));
  document.getElementById('prodBarcode').value = code;
});

document.getElementById('saveProdBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('prodName').value.trim();
  const cost = parseFloat(document.getElementById('prodCost').value) || 0;
  const price = parseFloat(document.getElementById('prodPrice').value);
  const category = document.getElementById('prodCat').value;
  const barcode = document.getElementById('prodBarcode').value.trim();
  if(!name){ toast('تکایە ناوی بۆنەکە بنووسە'); return; }
  if(isNaN(price) || price<0){ toast('تکایە نرخێکی دروست بنووسە'); return; }
  if(!category){ toast('تکایە کاتاگۆری هەڵبژێرە'); return; }
  if(barcode && data.products.some(p=>p.barcode===barcode && p.id!==editingProductId)){
    toast('ئەم کۆدە پێشتر بۆ بەرهەمێکی تر بەکارهاتووە'); return;
  }

  if(editingProductId){
    const p = data.products.find(p=>p.id===editingProductId);
    p.name = name; p.price = price; p.cost = cost; p.category = category; p.barcode = barcode||null;
    if(pendingImage) p.image = pendingImage;
    toast('بەرهەم نوێکرایەوە');
  }else{
    data.products.push({ id: uid(), name, price, cost, category, barcode: barcode||null, image: pendingImage||null });
    toast('بەرهەم زیادکرا');
  }
  await saveData();
  resetForm();
  renderManage();
  renderProductGrid();
});

function editProduct(id){
  const p = data.products.find(p=>p.id===id);
  if(!p) return;
  editingProductId = id;
  pendingImage = null;
  document.getElementById('formTitle').textContent = 'دەستکاریکردنی بەرهەم';
  document.getElementById('prodName').value = p.name;
  document.getElementById('prodCost').value = p.cost || '';
  document.getElementById('prodPrice').value = p.price;
  document.getElementById('prodBarcode').value = p.barcode || '';
  renderCatSelect();
  document.getElementById('prodCat').value = p.category;
  document.getElementById('imgPreviewWrap').innerHTML = p.image ? `<img src="${p.image}">` : '<span class="hint">کرتە بکە بۆ هەڵبژاردنی وێنە</span>';
  document.getElementById('cancelProdBtn').style.display = 'inline-block';
  updateProfitHint();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteProduct(id){
  if(!confirm('دڵنیایت لە سڕینەوەی ئەم بەرهەمە؟')) return;
  data.products = data.products.filter(p=>p.id!==id);
  await saveData();
  renderManage();
  renderProductGrid();
  toast('بەرهەم سڕایەوە');
}

function renderProdList(){
  const wrap = document.getElementById('prodList');
  document.getElementById('prodTotalCount').textContent = data.products.length;
  if(data.products.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="big">🧴</div>هێشتا هیچ بەرهەمێکت زیاد نەکردووە</div>`;
    return;
  }
  wrap.innerHTML = data.products.map(p=>{
    const profit = p.price - (p.cost||0);
    return `
    <div class="prod-row">
      ${p.image?`<img src="${p.image}">`:`<div style="width:38px;height:38px;border-radius:8px;background:var(--cream-dark);"></div>`}
      <div class="pr-info">
        <div class="pr-name">${escapeHtml(p.name)}</div>
        <div class="pr-meta">${escapeHtml(p.category)} · ${fmt(p.price)} ${p.cost?`· قازانج ${fmt(profit)}`:''}</div>
        ${p.barcode?`<div class="pr-barcode">#${escapeHtml(p.barcode)}</div>`:''}
      </div>
      <button class="icon-btn" title="دەستکاری" data-edit="${p.id}">✎</button>
      <button class="icon-btn danger" title="سڕینەوە" data-del="${p.id}">🗑</button>
    </div>
  `;
  }).join('');
  wrap.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>editProduct(b.dataset.edit)));
  wrap.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>deleteProduct(b.dataset.del)));
}

function renderManage(){
  renderCatSelect();
  renderCatList();
  renderProdList();
}

/* ---------------- HISTORY ---------------- */
function renderHistory(){
  const revenue = data.sales.reduce((s,sale)=>s+sale.total,0);
  const totalProfit = data.sales.reduce((s,sale)=> s + (sale.profit!=null ? sale.profit : sale.items.reduce((ss,it)=>ss+(it.price-(it.cost||0))*it.qty,0)), 0);
  document.getElementById('statRevenue').textContent = fmt(revenue);
  document.getElementById('statProfit').textContent = fmt(totalProfit);
  document.getElementById('statCount').textContent = data.sales.length;

  const tally = {};
  data.sales.forEach(sale=>sale.items.forEach(it=>{ tally[it.name] = (tally[it.name]||0)+it.qty; }));
  const top = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('statTop').textContent = top ? top[0] : '—';

  const list = document.getElementById('historyList');
  if(data.sales.length===0){
    list.innerHTML = `<div class="empty-state"><div class="big">🧾</div>هێشتا هیچ فرۆشتنێک تۆمار نەکراوە</div>`;
    return;
  }
  list.innerHTML = data.sales.map(sale=>{
    const d = new Date(sale.date);
    const dateStr = d.toLocaleDateString('en-GB') + ' — ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const saleProfit = sale.profit!=null ? sale.profit : sale.items.reduce((ss,it)=>ss+(it.price-(it.cost||0))*it.qty,0);
    return `
    <div class="sale-card">
      <div class="sale-head" data-id="${sale.id}">
        <span class="sh-date">${dateStr}</span>
        <span class="sh-total">${fmt(sale.total)}</span>
      </div>
      <div class="sale-body" id="sb-${sale.id}">
        ${sale.items.map(it=>`<div class="sale-line"><span>${escapeHtml(it.name)} × ${it.qty}</span><span>${fmt(it.price*it.qty)}</span></div>`).join('')}
        <div class="sale-line" style="border-top:1px dashed var(--cream-dark);padding-top:8px;margin-top:4px;font-weight:700;color:var(--success);"><span>قازانجی ئەم فرۆشتنە</span><span>${fmt(saleProfit)}</span></div>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.sale-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      document.getElementById('sb-'+h.dataset.id).classList.toggle('open');
    });
  });
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadData();
</script>
